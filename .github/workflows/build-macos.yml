name: Build macOS Release

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build-macos:
    # Per-architecture matrix: build natively on each runner so the produced
    # binary's architecture is honest. macOS releases used to run only on
    # `macos-latest` (now Apple Silicon) and ship the arm64 binary under an
    # `-x64` name — unrunnable on Intel Macs ("Bad CPU type in executable").
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # Intel x86_64 (macos-13 retired Dec 2025; macos-15-intel is GitHub's Intel image, available until ~Aug 2027)
            arch: x64
          - runner: macos-14   # Apple Silicon arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Checkout submodules
      run: |
        git submodule update --init depends/randomx
        git submodule update --init depends/chiavdf
        # libzmq is a submodule (depends/libzmq) — required by the Makefile's
        # `libzmq` target which all node binaries depend on.
        git submodule update --init depends/libzmq

    - name: Install dependencies
      run: |
        brew install leveldb cmake openssl miniupnpc gmp

    - name: Build RandomX
      run: |
        cd depends/randomx
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(sysctl -n hw.ncpu)
        ls -lh librandomx.a

    - name: Build Dilithion
      run: |
        # Find installation paths
        OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl 2>/dev/null || echo "/opt/homebrew/opt/openssl@3")
        MINIUPNPC_PREFIX=$(brew --prefix miniupnpc)
        GMP_PREFIX=$(brew --prefix gmp)
        echo "Using OpenSSL at: $OPENSSL_PREFIX"
        echo "Using miniupnpc at: $MINIUPNPC_PREFIX"
        echo "Using GMP at: $GMP_PREFIX"
        export CPPFLAGS="-I$OPENSSL_PREFIX/include -I$MINIUPNPC_PREFIX/include -I$GMP_PREFIX/include"
        export LDFLAGS="-L$OPENSSL_PREFIX/lib -Ldepends/randomx/build -L$(brew --prefix leveldb)/lib -L$MINIUPNPC_PREFIX/lib -L$GMP_PREFIX/lib"
        export CFLAGS="-I$OPENSSL_PREFIX/include -I$MINIUPNPC_PREFIX/include -I$GMP_PREFIX/include"
        export CXXFLAGS="-std=c++17 -I$OPENSSL_PREFIX/include -I$MINIUPNPC_PREFIX/include -I$GMP_PREFIX/include"
        make clean
        make -j$(sysctl -n hw.ncpu)
        ls -lh dilithion-node check-wallet-balance genesis_gen
        echo "Built architecture:"
        file dilithion-node

    - name: Extract version from tag
      id: get_version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="v1.0.11"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Create release package
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        ARCH: ${{ matrix.arch }}
      run: |
        chmod +x package-macos-release.sh
        ./package-macos-release.sh

    - name: Clean-room smoke test (BLOCKING)
      # Run the JUST-PACKAGED binary and prove it is self-contained. The macOS
      # runner is NOT a clean machine (Homebrew is installed), so the real
      # isolation proof is the otool dependency check: every non-system dylib
      # the binary links MUST be bundled under the package's lib/ (the packager
      # rewrites refs to @executable_path/lib/<name>). We also actually launch
      # the binary. This gate blocks the upload steps below on failure.
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        ARCH: ${{ matrix.arch }}
      run: |
        set -e
        RELEASE_NAME="dilithion-${VERSION}-mainnet-macos-${ARCH}"
        PKG="releases/${RELEASE_NAME}"
        BIN="${PKG}/dilithion-node"
        # Manifest assertion: key files present.
        for f in "${BIN}" "${PKG}/lib" "${PKG}/README.txt"; do
          [ -e "$f" ] || { echo "CLEAN-ROOM FAIL: missing $f in package"; exit 1; }
        done
        # Strip quarantine so a fresh download would launch.
        xattr -dr com.apple.quarantine "${PKG}" || true
        # Every non-system dylib (not under /usr/lib or /System) must be bundled.
        echo "otool -L dilithion-node:"
        otool -L "${BIN}"
        FAIL=0
        while read -r dep; do
          case "$dep" in
            /usr/lib/*|/System/*|@executable_path/*|@loader_path/*|@rpath/*) ;;
            "") ;;
            *)
              base=$(basename "$dep")
              if [ ! -f "${PKG}/lib/${base}" ]; then
                echo "CLEAN-ROOM FAIL: non-system dylib not bundled: $dep"
                FAIL=1
              fi
              ;;
          esac
        done < <(otool -L "${BIN}" | tail -n +2 | awk '{print $1}')
        [ "$FAIL" -eq 0 ] || exit 1
        # Must actually start (prints usage banner; --help/--version exit non-zero by design).
        # macOS lacks GNU `timeout`; use a perl alarm watchdog (always present).
        run_guarded() { perl -e 'alarm shift; exec @ARGV' 20 "$@"; }
        out=$(run_guarded "${BIN}" --help 2>&1 || true)
        echo "$out" | head -3
        # Assert on the post-main() banner only the RUNNING binary prints; a dyld error echoes
        # the binary path (contains "dilithion") to stderr before main and must NOT count as start.
        echo "$out" | grep -q "Post-Quantum Cryptocurrency" || { echo "CLEAN-ROOM FAIL: binary did not start (no post-main banner)"; exit 1; }
        echo "CLEAN-ROOM PASS"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: dilithion-${{ steps.get_version.outputs.version }}-mainnet-macos-${{ matrix.arch }}
        path: releases/dilithion-${{ steps.get_version.outputs.version }}-mainnet-macos-${{ matrix.arch }}.tar.gz

    - name: Upload to release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: releases/dilithion-${{ steps.get_version.outputs.version }}-mainnet-macos-${{ matrix.arch }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
