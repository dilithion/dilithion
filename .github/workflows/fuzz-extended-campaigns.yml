name: Fuzzing Extended Campaigns

# Weekly fuzzing campaign (Sunday 02:00 UTC).
#
# Job-minute budget per run. "Fuzz" is the libFuzzer -max_total_time; "Cap" is the
# job timeout-minutes (build + fuzz + corpus merge + upload), so the Cap column is the
# guaranteed upper bound on billed minutes. Target: total <= ~2,100 per run
# (about 4.3 runs per month, ~9,000 of the 50,000 monthly minutes).
#
#   Target             Group                 Fuzz  Cap   Jobs  Cap total
#   difficulty         consensus             225   250   1     250
#   tx_validation      consensus             225   250   1     250
#   utxo               consensus             225   250   1     250
#   network_message    network-facing        225   250   1     250
#   p2p_validation     network-facing        225   250   1     250
#   serialize          network-facing        145   170   1     170
#   signature          network-facing         85   110   1     110
#   block              high-priority          85   110   1     110
#   merkle             high-priority          85   110   1     110
#   transaction        high-priority          85   110   1     110
#   subsidy            fast                   40    65   1      65
#   compactsize        fast                   40    65   1      65
#   sha3               fast                   40    65   1      65
#   report             (issue + summary)       -    10   1      10
#   TOTAL (worst case, all caps hit)                          2,065
#
# Previous layout gave 6 h fuzz to a job capped at 360 min (build time pushed it over the
# cap), ran nightly, and started every run from an empty corpus.
#
# Reporting: every target writes a status artifact. The report job turns those into a
# per-target table using distinct words (NO FINDINGS / FINDING / BUILD FAILED /
# INCOMPLETE / DID NOT RUN) and, on anything but NO FINDINGS, opens or updates the one
# open issue labelled "fuzz-campaign" in this repository.
#
# Corpus: kept per target in the Actions cache only (never uploaded as an artifact).
# Caches unused for 7 days are evicted; the weekly cadence restores each cache before
# that, which also refreshes it.

on:
  workflow_dispatch:
    inputs:
      minutes_override:
        description: 'Optional: fuzz minutes per target (smoke test). Empty = full budget.'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC

permissions:
  contents: read

concurrency:
  group: fuzz-extended-campaigns
  cancel-in-progress: false

jobs:
  fuzz:
    name: "fuzz_${{ matrix.target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.cap }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: difficulty,      fuzz_min: 225, cap: 250 }
          - { target: tx_validation,   fuzz_min: 225, cap: 250 }
          - { target: utxo,            fuzz_min: 225, cap: 250 }
          - { target: network_message, fuzz_min: 225, cap: 250 }
          - { target: p2p_validation,  fuzz_min: 225, cap: 250 }
          - { target: serialize,       fuzz_min: 145, cap: 170 }
          - { target: signature,       fuzz_min: 85,  cap: 110 }
          - { target: block,           fuzz_min: 85,  cap: 110 }
          - { target: merkle,          fuzz_min: 85,  cap: 110 }
          - { target: transaction,     fuzz_min: 85,  cap: 110 }
          - { target: subsidy,         fuzz_min: 40,  cap: 65 }
          - { target: compactsize,     fuzz_min: 40,  cap: 65 }
          - { target: sha3,            fuzz_min: 40,  cap: 65 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore corpus
        id: corpus_restore
        uses: actions/cache/restore@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Install dependencies and build libraries
        id: deps
        run: |
          # clang-14 ASan can segfault at startup under high ASLR entropy (vm.mmap_rnd_bits=32),
          # which would be misreported as a fuzz finding. Measured locally: 6/25 start-ups
          # crashed at 32, 0/25 at 28.
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          sudo apt-get update
          sudo apt-get install -y clang-14 libc++-14-dev libc++abi-14-dev cmake build-essential libleveldb-dev
          # Build RandomX library
          cd depends/randomx && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release .. && make -j$(nproc)
          cd ../../..
          # Build Dilithium library
          cd depends/dilithium/ref
          if [ ! -f Makefile ]; then
            echo 'CC ?= /usr/bin/cc' > Makefile
            echo 'CFLAGS += -Wall -O3 -fomit-frame-pointer' >> Makefile
            echo 'SOURCES = sign.c packing.c polyvec.c poly.c ntt.c reduce.c rounding.c fips202.c symmetric-shake.c randombytes.c' >> Makefile
            echo '.PHONY: all clean' >> Makefile
            echo 'all:' >> Makefile
            printf '\t$(CC) $(CFLAGS) -DDILITHIUM_MODE=3 -c $(SOURCES)\n' >> Makefile
            echo 'clean:' >> Makefile
            printf '\trm -f *.o\n' >> Makefile
          fi
          make clean || true
          make -j$(nproc)

      - name: Build fuzz target
        id: build
        run: |
          # Makefile automatically builds all required object files
          FUZZ_CXX=clang++-14 make -j$(nproc) fuzz_${{ matrix.target }}

      - name: Run fuzzing campaign
        id: run
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_MIN: ${{ inputs.minutes_override || matrix.fuzz_min }}
        run: |
          mkdir -p corpus findings
          echo "Restored corpus entries: $(ls corpus | wc -l)"
          DURATION_SECONDS=$((FUZZ_MIN * 60))

          set +e
          timeout $((DURATION_SECONDS + 300))s ./fuzz_${TARGET} \
            -max_total_time=${DURATION_SECONDS} \
            -timeout=60 \
            -rss_limit_mb=2048 \
            -artifact_prefix=findings/ \
            -print_final_stats=1 \
            corpus/ \
            2>&1 | tee campaign.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "fuzzer exit code: ${RC}"

          # Any crash, leak, OOM or timeout artifact (or any non-zero exit) fails the job.
          mv -f crash-* leak-* timeout-* oom-* findings/ 2>/dev/null || true
          if [ -n "$(ls -A findings 2>/dev/null)" ] || [ "${RC}" -ne 0 ]; then
            echo "FUZZ FINDING for ${TARGET} (exit ${RC})"
            ls -lh findings/ || true
            exit 1
          fi
          echo "No findings for ${TARGET}"

      - name: Minimise corpus
        if: steps.run.outcome == 'success' || steps.run.outcome == 'failure'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Bounded; a failed merge keeps the existing corpus.
          mkdir -p corpus_min
          if timeout 480s ./fuzz_${TARGET} -merge=1 -rss_limit_mb=2048 corpus_min/ corpus/ > merge.log 2>&1 \
             && [ -n "$(ls -A corpus_min)" ]; then
            rm -rf corpus && mv corpus_min corpus
            echo "Corpus minimised to $(ls corpus | wc -l) entries"
          else
            echo "::warning::corpus merge did not complete for ${TARGET}; keeping unminimised corpus"
          fi

      - name: Save corpus
        if: always() && hashFiles('corpus/**') != ''
        uses: actions/cache/save@v4
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record status
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          SETUP_OUTCOME: ${{ steps.deps.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          FUZZ_MIN: ${{ inputs.minutes_override || matrix.fuzz_min }}
        run: |
          mkdir -p status findings
          if [ "${SETUP_OUTCOME}" != "success" ] || [ "${BUILD_OUTCOME}" != "success" ]; then
            RESULT="BUILD FAILED"
          elif [ "${RUN_OUTCOME}" = "success" ]; then
            RESULT="NO FINDINGS"
          elif [ "${RUN_OUTCOME}" = "failure" ]; then
            RESULT="FINDING"
          else
            RESULT="INCOMPLETE"
          fi
          STATS=$(grep -E "stat::number_of_executed_units|stat::average_exec_per_sec" campaign.log 2>/dev/null | tr -s ' ' | tr '\n' ';' || true)
          {
            echo "result=${RESULT}"
            echo "target=${TARGET}"
            echo "fuzz_minutes=${FUZZ_MIN}"
            echo "outcomes=setup:${SETUP_OUTCOME} build:${BUILD_OUTCOME} run:${RUN_OUTCOME}"
            echo "stats=${STATS}"
            echo "findings=$(ls findings 2>/dev/null | tr '\n' ' ')"
          } > status/status.txt
          cat status/status.txt

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-status-${{ matrix.target }}
          path: status/status.txt
          retention-days: 90

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-log-${{ matrix.target }}
          path: campaign.log
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload findings
        if: always() && hashFiles('findings/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: findings/
          retention-days: 90

  report:
    name: "Campaign report"
    runs-on: ubuntu-latest
    needs: [fuzz]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TARGETS: difficulty tx_validation utxo network_message p2p_validation serialize signature block merkle transaction subsidy compactsize sha3
      FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}

    steps:
      - name: Download status artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: fuzz-status-*
          path: status

      - name: Build summary
        id: summary
        if: always()
        run: |
          : > table.md
          : > problems.md
          BAD=0
          for t in ${TARGETS}; do
            f="status/fuzz-status-${t}/status.txt"
            if [ -f "$f" ]; then
              result=$(sed -n 's/^result=//p' "$f")
              mins=$(sed -n 's/^fuzz_minutes=//p' "$f")
              stats=$(sed -n 's/^stats=//p' "$f")
              findings=$(sed -n 's/^findings=//p' "$f")
            else
              result="DID NOT RUN"; mins="-"; stats=""; findings=""
            fi
            echo "| ${t} | ${result} | ${mins} | ${stats} |" >> table.md
            if [ "${result}" != "NO FINDINGS" ]; then
              BAD=1
              art="fuzz-log-${t}"
              if [ -n "${findings}" ]; then art="fuzz-findings-${t}, fuzz-log-${t}"; fi
              if [ "${result}" = "DID NOT RUN" ]; then art="(none: the job produced no artifacts)"; fi
              echo "- ${t}: ${result}; artifacts: ${art}" >> problems.md
            fi
          done
          {
            echo "# Fuzzing campaign result"
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo "NO FINDINGS means the fuzzer ran for the full duration and found nothing."
            echo "BUILD FAILED, INCOMPLETE and DID NOT RUN mean that target was NOT fuzzed to completion."
            echo ""
            echo "| Target | Result | Fuzz minutes | Stats |"
            echo "|---|---|---|---|"
            cat table.md
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "bad=${BAD}" >> "$GITHUB_OUTPUT"

      - name: Open or update fuzz-campaign issue
        if: always() && steps.summary.outputs.bad == '1'
        run: |
          {
            echo "Fuzz campaign failure report."
            echo ""
            echo "Run: ${RUN_URL}"
            echo "Fuzz job group result: ${FUZZ_JOB_RESULT}"
            echo ""
            echo "Targets needing attention (fuzz findings, build failures, incomplete or not-started jobs):"
            cat problems.md
            echo ""
            echo "Artifacts named fuzz-findings-<target> hold the reproducer inputs and fuzz-log-<target> the fuzzer log. Both are attached to the run above and kept for 90 days. Corpora are not uploaded."
            echo ""
            echo "Full per-target table:"
            echo ""
            echo "| Target | Result | Fuzz minutes | Stats |"
            echo "|---|---|---|---|"
            cat table.md
          } > issue_body.md

          gh label create fuzz-campaign --repo "$GITHUB_REPOSITORY" \
            --description "Fuzz campaign findings and failures" --color B60205 2>/dev/null || true

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label fuzz-campaign --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "$GITHUB_REPOSITORY" --body-file issue_body.md
            echo "Updated issue #${EXISTING}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label fuzz-campaign \
              --title "Fuzz campaign: failure report" --body-file issue_body.md
          fi

      - name: Fail the run if any target did not finish clean
        if: always() && steps.summary.outputs.bad == '1'
        run: |
          echo "One or more targets did not finish with NO FINDINGS:"
          cat problems.md
          exit 1
