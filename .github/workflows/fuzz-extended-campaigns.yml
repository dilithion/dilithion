name: Fuzzing Extended Campaigns

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      tier1_hours:
        description: 'Tier 1 (Consensus-critical) duration (hours)'
        required: true
        default: '6'
        type: choice
        options:
          - '2'
          - '4'
          - '6'
      tier2_hours:
        description: 'Tier 2 (High-priority) duration (hours)'
        required: true
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
      tier3_hours:
        description: 'Tier 3 (Fast fuzzers) duration (hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '2'
  schedule:
    # Run nightly at 2 AM UTC (optional)
    - cron: '0 2 * * *'

jobs:
  # Tier 1: Consensus-critical fuzzers (6 hours each)
  fuzz-difficulty:
    name: "Difficulty Adjustment (Tier 1)"
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # 6 hours

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 libc++-14-dev libc++abi-14-dev cmake build-essential libleveldb-dev

      - name: Build dependencies
        run: |
          # Build RandomX library
          cd depends/randomx && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release .. && make -j$(nproc)
          cd ../../..
          # Build Dilithium library
          cd depends/dilithium/ref
          if [ ! -f Makefile ]; then
            echo 'CC ?= /usr/bin/cc' > Makefile
            echo 'CFLAGS += -Wall -O3 -fomit-frame-pointer' >> Makefile
            echo 'SOURCES = sign.c packing.c polyvec.c poly.c ntt.c reduce.c rounding.c fips202.c symmetric-shake.c randombytes.c' >> Makefile
            echo '.PHONY: all clean' >> Makefile
            echo 'all:' >> Makefile
            printf '\t$(CC) $(CFLAGS) -DDILITHIUM_MODE=3 -c $(SOURCES)\n' >> Makefile
            echo 'clean:' >> Makefile
            printf '\trm -f *.o\n' >> Makefile
          fi
          make clean || true
          make -j$(nproc)

      - name: Build fuzz_difficulty
        run: |
          # Makefile automatically builds all required object files
          FUZZ_CXX=clang++-14 make fuzz_difficulty

      - name: Run fuzzing campaign
        run: |
          mkdir -p fuzz_corpus/difficulty
          DURATION=${{ github.event.inputs.tier1_hours || '6' }}
          DURATION_SECONDS=$((DURATION * 3600))

          timeout ${DURATION_SECONDS}s ./fuzz_difficulty \
            -max_total_time=${DURATION_SECONDS} \
            -workers=2 \
            -timeout=60 \
            -rss_limit_mb=2048 \
            -print_final_stats=1 \
            fuzz_corpus/difficulty/ \
            2>&1 | tee fuzz_difficulty_campaign.log || true

      - name: Check for crashes
        run: |
          if ls crash-* 2>/dev/null || ls leak-* 2>/dev/null || ls timeout-* 2>/dev/null; then
            echo "⚠️ CRASHES FOUND!"
            ls -lh crash-* leak-* timeout-* 2>/dev/null || true
            exit 1
          else
            echo "✅ No crashes found"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-difficulty-results
          path: |
            fuzz_difficulty_campaign.log
            crash-*
            leak-*
            timeout-*
            fuzz_corpus/difficulty/
          retention-days: 30

