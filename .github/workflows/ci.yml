name: Dilithion CI

# TRIGGERS — read the note before narrowing these again.
#
# Until 2026-09-02 this workflow fired ONLY on main/master and had no
# workflow_dispatch. The consequence, found during the v4.6.0 audit: the release
# candidate sat 58 commits ahead of main on `release/v4.6.0-assembled`, was never
# PR'd into main, and therefore NEVER RAN THROUGH CI AT ALL — no Linux build, no
# macOS build, no sanitizer job, on any of it. The first Linux compile of that
# code would have happened at tag push, in the public release pipeline.
#
# A release branch is the LAST thing that should bypass CI, so:
#   * `release/**` and `rc*/**` now trigger on push, so a release candidate is
#     built and tested continuously as it is assembled.
#   * `workflow_dispatch` allows CI to be run on ANY branch on demand — including
#     on the private mirror, where security releases are built before disclosure.
on:
  push:
    branches: [ main, master, 'release/**', 'rc*/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    # 30 -> 45: the gcc/Release leg now also links and RUNS the standalone test
    # suites (make tests-fast). Measured locally: ~8s to link 45 suite binaries
    # on top of an already-built tree, ~55s to run the 31 live fast-tier suites.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libleveldb-dev \
          libssl-dev \
          libboost-test-dev \
          libminiupnpc-dev \
          ccache \
          clang-format \
          cppcheck \
          valgrind

    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        fi
        # Job-start clock for the hang watchdog further down. `timeout-minutes`
        # is measured from JOB start, but a watchdog inside a step can only see
        # STEP time -- so the watchdog has to know how much of the job budget
        # the build already spent, or it fires after the ceiling and is inert.
        echo "JOB_START_EPOCH=$(date +%s)" >> $GITHUB_ENV

    # gdb is needed only on the hang path, but installing it THERE would spend
    # minutes of a budget that is already exhausted, and would fail silently.
    - name: Install hang-capture tooling
      run: |
        sudo apt-get install -y -q gdb
        # gdb must be able to attach to a non-descendant; the runner default
        # blocks that and a failed attach would waste the one occurrence we get.
        sudo sysctl -w kernel.yama.ptrace_scope=0

    - name: Build RandomX
      run: |
        cd depends/randomx
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Build Dilithium library
      run: |
        # Check if dilithium source files exist (they're tracked in repo with HD wallet modifications)
        if [ ! -f depends/dilithium/ref/sign.c ]; then
          echo "ERROR: Dilithium source files missing. They should be tracked in the repo."
          exit 1
        fi
        # Create Makefile if it doesn't exist (gitignored but needed for build)
        if [ ! -f depends/dilithium/ref/Makefile ]; then
          echo "Creating Dilithium Makefile..."
          echo 'CC ?= /usr/bin/cc' > depends/dilithium/ref/Makefile
          echo 'CFLAGS += -Wall -Wextra -Wpedantic -Wmissing-prototypes -Wredundant-decls -Wshadow -Wvla -Wpointer-arith -O3 -fomit-frame-pointer' >> depends/dilithium/ref/Makefile
          echo 'SOURCES = sign.c packing.c polyvec.c poly.c ntt.c reduce.c rounding.c fips202.c symmetric-shake.c randombytes.c' >> depends/dilithium/ref/Makefile
          echo '.PHONY: all clean' >> depends/dilithium/ref/Makefile
          echo 'all:' >> depends/dilithium/ref/Makefile
          printf '\t$(CC) $(CFLAGS) -DDILITHIUM_MODE=3 -c $(SOURCES)\n' >> depends/dilithium/ref/Makefile
          echo 'clean:' >> depends/dilithium/ref/Makefile
          printf '\trm -f *.o\n' >> depends/dilithium/ref/Makefile
        fi
        cd depends/dilithium/ref
        make clean || true
        make -j$(nproc)

    - name: Build Dilithion Node
      run: |
        make dilithion-node -j$(nproc)

    - name: Build Genesis Generator
      run: |
        make genesis_gen -j$(nproc)

    - name: Wallet-preservation guard regression
      run: |
        # An unreadable wallet.dat must never be overwritten by the
        # create-new-wallet path. Builds both node binaries (both carried the
        # bug) and drives them against a corrupt wallet. See
        # scripts/wallet_load_guard_test.sh for the v4.5.0 incident this pins.
        make wallet_load_guard_test -j$(nproc)

    - name: Build Boost Unit Tests
      run: |
        make test_dilithion -j$(nproc)

    - name: Run Boost Unit Tests
      run: |
        # Skip HD wallet tests temporarily - GetNewHDAddress() hangs in CI (BUG-77)
        # Likely blocking on /dev/random or deadlock issue
        # NOTE: the "/dev/random" half of that guess is FALSE - every entropy
        # source in the tree is /dev/urandom (rpc/auth.cpp:168,
        # script/htlc.cpp:282, wallet/crypter.cpp:411), which does not block on
        # modern Linux. The live hypothesis is the "or deadlock" half.
        # Affected: wallet_hd_tests, rpc_hd_wallet_tests, hd_wallet_standalone_tests
        #
        # HANG INSTRUMENT. test_dilithion intermittently hangs (~8% of Release
        # runs: this job on run 33929931137, and gcc/Release on main run
        # 33887089440, both ending "Terminate orphan process: (test_dilithion)").
        # When the job ceiling fires the runner kills the orphan and the process
        # state is GONE - which is why the hang has never been diagnosed. 44
        # local runs (20 full-width + 24 pinned to 4 cores) reproduced it ZERO
        # times, so the evidence has to be captured where it happens: here.
        #
        # THE BUDGET IS COMPUTED, NOT A LITERAL, AND THAT IS THE WHOLE POINT.
        # `timeout-minutes: 45` is measured from JOB start; a watchdog inside
        # this step can only measure STEP time. Measured on the hung job
        # (run 33929931137, steps API):
        #     job start                 00:43:37
        #     "Run Boost Unit Tests"    01:03:33   <- 19m56s of the job already
        #                                             spent (16m19s of it in the
        #                                             wallet-guard step alone)
        #     45-min ceiling            01:28:37
        # So this step had ~25 minutes of real budget, not 45. A fixed 38-minute
        # watchdog - which is what the first version of this used - would have
        # fired at 01:41, THIRTEEN MINUTES AFTER the ceiling: the instrument
        # would never once have run. Deriving the budget from JOB_START_EPOCH
        # makes it correct now and self-correcting as the build gets slower.
        set -uo pipefail
        mkdir -p test-hang-artifacts

        CEILING_SEC=$(( 45 * 60 ))
        CAPTURE_MARGIN=240        # gdb attach + dump + artifact upload
        MIN_BUDGET=300            # never watchdog a run into uselessness
        # Cap against the MEASURED healthy step, not against the ceiling. On a
        # green main run (34082001939) this step takes 44s / 47s / 57s / 61s
        # across the four legs; the hung leg ran 1516s. 600s is ~10x the healthy
        # maximum and ~2.5x below the hang, so it catches the hang ten minutes
        # in instead of twenty-five, and leaves the rest of the ceiling as
        # margin. (An earlier comment here cited "~21 min" for this step -- that
        # was the JOB's wall time misread as the step's. The step is ~1 minute.)
        MAX_BUDGET=600
        elapsed=$(( $(date +%s) - JOB_START_EPOCH ))
        BUDGET=$(( CEILING_SEC - elapsed - CAPTURE_MARGIN ))
        [ "$BUDGET" -gt "$MAX_BUDGET" ] && BUDGET="$MAX_BUDGET"
        # If the build has already eaten the budget there is nothing left to
        # watchdog WITH, and the clamp below would arm a timer that fires after
        # the ceiling -- inert, exactly like the version this replaces. Say so
        # out loud: otherwise a missing artifact reads as "no hang happened"
        # when it actually means "the instrument never armed".
        if [ "$BUDGET" -lt "$MIN_BUDGET" ]; then
          echo "::warning::hang watchdog NOT ARMED: ${elapsed}s of the ${CEILING_SEC}s job budget already spent, leaving less than ${MIN_BUDGET}s. A missing hang artifact from this run means nothing."
          BUDGET="$MIN_BUDGET"
        fi
        echo "hang watchdog: ${elapsed}s of the job already spent; budget ${BUDGET}s"

        ./test_dilithion --log_level=test_suite --report_level=short           --run_test='!wallet_hd_tests:!rpc_hd_wallet_tests:!hd_wallet_standalone_tests' &
        TD_PID=$!

        (
          sleep "$BUDGET"
          if kill -0 "$TD_PID" 2>/dev/null; then
            echo "::error::test_dilithion still alive after ${BUDGET}s - capturing stack before kill (intermittent hang)"
            {
              echo "=== test_dilithion hang, captured $(date -u +%FT%TZ) ==="
              echo "=== /proc/$TD_PID/status ==="; cat "/proc/$TD_PID/status" 2>&1
              echo "=== per-thread wchan (kernel wait channel) ==="
              for t in /proc/"$TD_PID"/task/*; do
                echo "--- tid ${t##*/} comm=$(cat "$t/comm" 2>/dev/null) wchan=$(cat "$t/wchan" 2>/dev/null)"
              done
              # gdb gets its own timeout: if IT stalls on attach we ride to the
              # ceiling and learn nothing, which is the failure this exists to end.
              echo "=== gdb: thread map + all backtraces ==="
              timeout -k 10 180 gdb -p "$TD_PID" -batch -ex 'info threads' -ex 'thread apply all bt 25' 2>&1
              echo "(gdb exit: $?)"
            } > test-hang-artifacts/test_dilithion_hang_stack.txt
            kill -9 "$TD_PID" 2>/dev/null || true
          fi
        ) &
        WATCHDOG=$!

        # `wait` under bash -e (GitHub's default shell) ABORTS the step on a
        # non-zero status, so `wait "$TD_PID"; rc=$?` would make every line
        # below dead on exactly the failure path we care about.
        rc=0
        wait "$TD_PID" || rc=$?

        # Kill the watchdog AND its sleep child. Killing only the subshell
        # leaves the sleep orphaned holding this step's stdout open.
        kill "$WATCHDOG" 2>/dev/null || true
        pkill -P "$WATCHDOG" 2>/dev/null || true
        wait "$WATCHDOG" 2>/dev/null || true

        if [ "$rc" -ne 0 ]; then
          echo "Boost unit tests exited $rc"
          exit "$rc"
        fi
        echo "✅ Boost unit tests completed (HD wallet tests skipped - BUG-77)"

    # Only produces a file when the hang actually fired; otherwise no-op.
    - name: Upload hang stack (only if the hang fired)
      # NOT gated to one compiler: the hang has been observed on clang/Release
      # (run 33929931137) AND gcc/Release (main run 33887089440). if-no-files-found
      # makes this a no-op on every healthy leg.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-dilithion-hang-stack-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: test-hang-artifacts/
        retention-days: 30
        if-no-files-found: ignore

    # ------------------------------------------------------------------
    # F4: the standalone (non-Boost) test suites.
    #
    # Before F4, `make tests` had a one-line recipe that echoed "All tests
    # built successfully" and executed nothing, and this workflow never
    # invoked it at all — so ~46 test binaries had never been run by any
    # automated process. Several no longer compiled; several were failing.
    #
    # Runs on ONE matrix leg only (gcc/Release): the suites are
    # compiler-and-optimisation-agnostic and re-running them on all four legs
    # would quadruple the cost for no extra signal. The core objects are
    # already compiled by the "Build Dilithion Node" step above, so the
    # marginal cost here is link + run, not a second full build.
    #
    # The roster, tiers, timeouts and quarantines live in
    # scripts/run_test_suites.sh — that file is the single source of truth and
    # every quarantine there carries a written reason.
    # ------------------------------------------------------------------
    - name: Run standalone test suites (fast tier)
      if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
      run: |
        make tests-fast -j$(nproc)

    - name: Upload standalone suite logs
      if: always() && matrix.compiler == 'gcc' && matrix.build_type == 'Release'
      uses: actions/upload-artifact@v7
      with:
        name: standalone-suite-logs-fast
        path: test-suite-logs/
        retention-days: 14
        if-no-files-found: ignore

  sanitizer-asan:
    name: AddressSanitizer (Memory Safety)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libleveldb-dev \
          libssl-dev \
          libboost-test-dev \
          libminiupnpc-dev \
          clang

    - name: Set up compiler with ASan
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS=-fsanitize=address -fno-omit-frame-pointer -g" >> $GITHUB_ENV
        echo "CXXFLAGS=-fsanitize=address -fno-omit-frame-pointer -g -std=c++17" >> $GITHUB_ENV
        echo "LDFLAGS=-fsanitize=address" >> $GITHUB_ENV

    - name: Build RandomX
      run: |
        cd depends/randomx
        mkdir -p build
        cd build
        cmake .. -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
                 -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
        make -j$(nproc)

    - name: Build Dilithium library
      run: |
        if [ ! -f depends/dilithium/ref/sign.c ]; then
          echo "ERROR: Dilithium source files missing. They should be tracked in the repo."
          exit 1
        fi
        if [ ! -f depends/dilithium/ref/Makefile ]; then
          echo "Creating Dilithium Makefile..."
          echo 'CC ?= /usr/bin/cc' > depends/dilithium/ref/Makefile
          echo 'CFLAGS += -Wall -Wextra -Wpedantic -Wmissing-prototypes -Wredundant-decls -Wshadow -Wvla -Wpointer-arith -O3 -fomit-frame-pointer' >> depends/dilithium/ref/Makefile
          echo 'SOURCES = sign.c packing.c polyvec.c poly.c ntt.c reduce.c rounding.c fips202.c symmetric-shake.c randombytes.c' >> depends/dilithium/ref/Makefile
          echo '.PHONY: all clean' >> depends/dilithium/ref/Makefile
          echo 'all:' >> depends/dilithium/ref/Makefile
          printf '\t$(CC) $(CFLAGS) -DDILITHIUM_MODE=3 -c $(SOURCES)\n' >> depends/dilithium/ref/Makefile
          echo 'clean:' >> depends/dilithium/ref/Makefile
          printf '\trm -f *.o\n' >> depends/dilithium/ref/Makefile
        fi
        cd depends/dilithium/ref
        make clean || true
        CFLAGS="-fsanitize=address -fno-omit-frame-pointer -O2 -DDILITHIUM_MODE=3" make -j$(nproc)

    - name: Build with ASan
      run: |
        make clean
        make test_dilithion -j$(nproc)

    - name: Run ASan Tests
      run: |
        # Phase 8: Run tests with ASan to detect memory errors
        # Skip HD wallet tests - BUG-77 (GetNewHDAddress hangs)
        echo "Running tests with AddressSanitizer..."
        ./test_dilithion --log_level=test_suite --report_level=short --run_test='!wallet_hd_tests:!rpc_hd_wallet_tests:!hd_wallet_standalone_tests' || true
        echo "✅ ASan tests completed (check output above for memory errors)"

