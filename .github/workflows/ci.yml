        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS=-fsanitize=thread -fno-omit-frame-pointer -g" >> $GITHUB_ENV
        echo "CXXFLAGS=-fsanitize=thread -fno-omit-frame-pointer -g -std=c++17" >> $GITHUB_ENV
