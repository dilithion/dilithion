name: Repo Hygiene

# Prevents cruft (build artifacts, session docs, coverage HTML dumps,
# private dev config, Windows path-escape bugs) from landing in main.
# Runs on every PR and every push to main.
#
# The actual checks live in scripts/check-repo-hygiene.sh — that script
# is the single source of truth and can also be run locally:
#
#     ./scripts/check-repo-hygiene.sh
#
# To add a new allowed root-level file, edit ALLOWED_ROOT_FILES in
# that script and explain why in the PR description.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs of the same ref. Without this, every push queues a
# FULL run behind its own predecessor: on 2026-09-07 the Actions queue hit 6
# in-progress / 12 queued, two of them superseded pushes of a single branch that
# nothing ever cancelled. Cost and throughput, not a gate: what runs is
# unchanged, only how many stale copies of it.
#
# main is deliberately NEVER cancelled -- a cancelled main run destroys the
# record for that commit, which is exactly how the test_dilithion hang stayed
# undiagnosed (a `cancelled` conclusion reads as a failure and its evidence is
# gone).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    name: Check repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # We only need current state, not full history.
          fetch-depth: 1

      - name: Make hygiene script executable
        run: chmod +x scripts/check-repo-hygiene.sh

      - name: Run repo hygiene checks
        run: ./scripts/check-repo-hygiene.sh
